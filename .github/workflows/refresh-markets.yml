name: Refresh Korean and crypto markets
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_markets.py'
      - '.github/workflows/refresh-markets.yml'
permissions:
  contents: write
concurrency:
  group: market-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public headlines and quotes
        run: python scripts/collect_markets.py
      - name: Save snapshots (frontend reads raw main data)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/markets.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh Korean and crypto market snapshots'
          git pull --rebase origin main
          git push origin HEAD:main
